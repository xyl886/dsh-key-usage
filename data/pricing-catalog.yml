# dsh-key-usage 内置官方价目（**唯一事实来源**：随包发布、只读、不可编辑）
#
# 写入原则（更新价目时同样遵守）：
# - 只写厂商**官方文档明确给出**的价格；文档没写的档位**留空**（不写该键），不用同类模型顶替、不猜测；
# - 每条都带 source（精确 URL）与 fetchedAt（抓取日期），界面上可追溯；
# - 币种按文档原样记录，**不做任何汇率换算**（DeepSeek 取中文文档的 CNY；Kimi 为 CNY；Z.ai / OpenRouter 只有 USD）。
#
# 解析器是 src/server/yaml-lite.ts 的受限子集：只支持注释、缩进映射、`- ` 列表、行内 `key: value`、
# 引号字符串、数字 / 布尔 / null、行内 `[a, b]`。tab 缩进、`|` / `>` 块标量、锚点 / 别名、多文档、
# flow 映射等写法会生成 issues 并跳过该条目（见 docs/01 §3.14），不会静默算错金额。

version: 1

rules:

  # --------------------------------------------------------------------------
  # DeepSeek 官方（CNY / 百万 tokens）
  # 来源：https://api-docs.deepseek.com/zh-cn/quick_start/pricing （英文页同价、不同币种）
  # 取**中文文档的 CNY 价**，不做汇率换算。
  # 
  # 错峰换算依据：官方原文「空闲时段价格为高峰时段价格的一半。北京时间周一至周五（不含中国法定
  # 节假日）9:00–12:00、14:00–18:00 为高峰时段；其余时段，包括周末及中国法定节假日全天均为空闲时段」。
  # 窗口按**本地时间**判定，且高峰只在周一至周五，因此每个窗口都带 days（1=周一 … 7=周日）：
  # 工作日三段 + 周末全天一段。限制：规则模型表达不了「中国法定节假日」，节假日会被算成高峰价，
  # 这是已知近似（方向：把空闲当高峰，金额偏高）。
  # --------------------------------------------------------------------------
  - provider: 'deepseek-official'
    model: 'deepseek-flash'
    unit: 'perMillionTokens'
    currency: 'CNY'
    input: 2
    cacheRead: 0.04
    cacheWrite: 2
    output: 8
    source: 'https://api-docs.deepseek.com/zh-cn/quick_start/pricing'
    fetchedAt: '2026-10-13'
    note: 'deepseek-flash（模型版本 DeepSeek-V4.1-Flash）高峰价：未命中 ¥2.00 / 命中 ¥0.04 / 输出 ¥8.00；缓存写入档文档未单列，沿用未命中价（口径推断，见 docs/05 附录 A.5）。错峰 = 高峰半价。高峰为北京时间周一至周五（不含中国法定节假日）9:00–12:00 与 14:00–18:00，其余时段（含周末全天）均为空闲时段；窗口按本地时间判定，工作日三段与周末全天各用一条窗口表达。限制：插件没有中国法定节假日日历，节假日会按高峰价算 —— 这是已知近似（方向：把空闲当高峰，金额偏高）。'
    noteEn: 'deepseek-flash (deepseek-official); miss ¥2 / cache-read ¥0.04 / output ¥8 per 1M tokens; rates as published by the vendor; see source and fetch date below'
    offPeak:
      input: 1
      cacheRead: 0.02
      cacheWrite: 1
      output: 4
      windows:
        - from: '00:00'
          to: '09:00'
          days: [1, 2, 3, 4, 5]
        - from: '12:00'
          to: '14:00'
          days: [1, 2, 3, 4, 5]
        - from: '18:00'
          to: '00:00'
          days: [1, 2, 3, 4, 5]
        - from: '00:00'
          to: '00:00'
          days: [6, 7]
